#  Description:               Host-only test configuration for aion_layout
# ================================================================
#
# The suite runs on a bare host: no Docker, no PDK, no network.  Anything that
# would reach the container is marked `docker` and deselected here, so the
# default invocation is the one a reviewer can trust to have actually run.
#
# `-q` lives here, so run the suite as `python3 -m pytest tests/`.  Passing a
# second `-q` on the command line takes pytest to quiet level 2, which drops the
# "N passed" line -- the one number anyone reading a test run wants.
[pytest]
testpaths = tests
pythonpath = .
addopts = -q -m "not docker"
markers =
    docker: needs the iic-osic-tools container or the PDK; deselected by default
filterwarnings =
    error::DeprecationWarning:aion_layout.*
